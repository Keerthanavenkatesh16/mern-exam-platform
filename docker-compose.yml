version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/secure_assessment_platform
      - JWT_ACCESS_SECRET=your_jwt_access_secret_key_change_me_32chars
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_key_change_me_32chars
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - COOKIE_SAME_SITE=lax
    depends_on:
      - mongo

  mongo:
    image: mongo:6-jammy
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
